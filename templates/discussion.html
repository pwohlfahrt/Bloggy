{% extends "base.html" %}
{% block window %}
<style>
    .comment {
        border: 1px solid {{color_scheme.secondary}};
        border-radius: 0;
        background: {{color_scheme.primary}};
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.18);
        padding: 12px;
        margin-bottom: 12px;
    }

    #discussion-section {
        margin: 0 auto;
        margin-top: 24px;
        width: 80%;
    }

    #typing-container {
        width: 76%;
        margin: 0 auto;
        margin-top: 30px;
        border: 1px solid {{color_scheme.secondary}};
        background: {{color_scheme.primary}};
        padding: 40px;
    }

    .reply-button {
        float: right;
    }

    @keyframes comment-highlight {
        0% { outline: 3px solid transparent; outline-offset: 3px; }
        25% { outline: 3px solid {{color_scheme.secondary}}; outline-offset: 3px; }
        100% { outline: 3px solid transparent; outline-offset: 3px; }
    }

    .comment.highlight {
        animation: comment-highlight 1.6s ease;
    }
</style>
<div id="typing-container">
    <h2>Say what you think</h2>
    <input type="text" id="comment-author" placeholder="Name" />
    <input type="text" id="comment-content" placeholder="Type your comment here..." />
    <input type="hidden" id="comment-reference" value="" />
    <label>Replying to comment ID: <span id="replying-to"></span></label>
    <button id="submit-comment" onclick="submitComment()">Submit</button>
    <script>
        function clearCommentForm() {
            document.getElementById('comment-author').value = '';
            document.getElementById('comment-content').value = '';
            document.getElementById('comment-reference').value = '';
            document.getElementById('replying-to').innerText = '';
        }
        
        function submitComment() {
            const author = document.getElementById('comment-author').value;
            const content = document.getElementById('comment-content').value;
            const reference = document.getElementById('comment-reference').value;
            fetch(`/blog/comments/{{title}}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ author, content, reference })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Comment added successfully') {
                    clearCommentForm();
                    loadComments();
                } else {
                    console.error('Failed to submit comment:', data.error);
                }
            })
            .catch(error => console.error('Error submitting comment:', error));
        }
    </script>
</div>
<div id="discussion-section">
    <script>
        function replyToComment(commentId, author) {
            document.getElementById('comment-reference').value = commentId;
            document.getElementById('replying-to').innerText = author;
            document.getElementById('comment-author').focus();
        }

        function scrollToComment(commentId) {
            const commentElement = document.getElementById(`comment-${commentId}`);
            if (!commentElement) {
                return;
            }
            commentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            commentElement.classList.remove('highlight');
            void commentElement.offsetWidth;
            commentElement.classList.add('highlight');
            commentElement.addEventListener('animationend', () => {
                commentElement.classList.remove('highlight');
            }, { once: true });
        }

        function escapeCommentText(value) {
            const element = document.createElement('span');
            element.textContent = value == null ? '' : String(value);
            return element.innerHTML;
        }

        let latestComment = 0;
        function loadComments(){
            const commentsContainer = document.getElementById('discussion-section');
            commentsContainer.innerHTML = '';

            fetch(`/blog/comments/{{title}}/0`)
                .then(response => response.json())
                .then(data => {
                    data.forEach(comment => {
                        console.log('Loaded comment:', comment);
                        const commentDiv = document.createElement('div');
                        commentDiv.className = 'comment';
                        commentDiv.id = `comment-${comment.id}`;

                        const parentCommentId = comment.reference ?? comment.refrence;
                        const author = escapeCommentText(comment.author);
                        const content = escapeCommentText(comment.content);
                        const id = escapeCommentText(comment.id);
                        if (parentCommentId) {
                            const reference = escapeCommentText(parentCommentId);
                            commentDiv.innerHTML = `<strong>${author}</strong> (in reply to <button onclick="scrollToComment('${reference}')">${reference}</button>): ${content} <em>${new Date(comment.created_at).toLocaleString()}</em><button class="reply-button" onclick="replyToComment('${id}', '${author}')">Reply</button>`;
                        } else {
                            commentDiv.innerHTML = `<strong>${author}</strong>: ${content} <em>${new Date(comment.created_at).toLocaleString()}</em><button class="reply-button" onclick="replyToComment('${id}', '${author}')">Reply</button>`;
                        }

                        commentsContainer.appendChild(commentDiv);
                        if (comment.id > latestComment) {
                            latestComment = comment.id;
                        }
                    });
                })
                .catch(error => console.error('Error fetching comments:', error));
        }
        loadComments();
    </script>
</div>
{% endblock %}
