{% extends "base.html" %}
{% block window %}
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 20px;">
    <h1 style="width: 100%; text-align: center;">Photo Gallery</h1>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center;">
        {% for photo in content %}
        <div style="margin: 10px; width: 300px; height: 300px; overflow: hidden;">
            <button style="background: none; border: none; cursor: pointer;" onclick="window.location.href='/photo/{{photo}}'"><img src="/content/photos/{{photo}}" alt="{{photo}}" style="width: 100%; height: 100%; object-fit: cover;"></button>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
