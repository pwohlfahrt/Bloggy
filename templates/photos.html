{% extends "base.html" %}
{% block window %}
<style>
    .gallery-page {
        box-sizing: border-box;
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px clamp(16px, 4vw, 56px) 56px;
    }

    .gallery-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
    }

    .gallery-heading h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: -0.04em;
    }

    .gallery-heading p {
        max-width: 280px;
        margin: 0 0 4px;
        opacity: 0.72;
        text-align: right;
    }

    .photo-grid {
        display: grid;
        grid-auto-rows: 180px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
    }

    .photo-tile {
        position: relative;
        display: block;
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgba(247, 247, 247, 0.18);
        background: {{ color_scheme.secondary }};
        color: inherit;
        isolation: isolate;
    }

    .photo-tile:nth-child(5n + 1) {
        grid-column: span 2;
        grid-row: span 2;
    }

    .photo-tile img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 350ms ease, filter 350ms ease;
    }

    .photo-tile::after {
        position: absolute;
        inset: 45% 0 0;
        z-index: 1;
        content: "";
    }

    .photo-tile:hover::after {
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), transparent);
    }

    .photo-label {
        position: absolute;
        right: 14px;
        bottom: 12px;
        left: 14px;
        z-index: 2;
        overflow: hidden;
        color: {{ color_scheme.text }};
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: none;
    }

    .photo-tile:hover img,
    .photo-tile:focus-visible img {
        filter: saturate(1.2);
        transform: scale(1.06);
    }

    .photo-tile:hover .photo-label,
    .photo-tile:focus-visible .photo-label {
        display: inline-block;
    }

    .photo-tile:focus-visible {
        outline: 3px solid {{ color_scheme.text }};
        outline-offset: 3px;
    }

    @media (max-width: 700px) {
        .gallery-page {
            padding-top: 24px;
        }

        .gallery-heading {
            align-items: start;
            flex-direction: column;
        }

        .gallery-heading p {
            text-align: left;
        }

        .photo-grid {
            grid-auto-rows: 150px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
</style>

<section class="gallery-page">
    <header class="gallery-heading">
        <h1>Photo Gallery</h1>
        <p>{{ quote }}</p>
    </header>

    <div class="photo-grid">
        {% for photo in content %}
        <a class="photo-tile" href="/photo/{{ photo }}">
            <img src="/content/photos/{{ photo }}" alt="{{ photo }}" loading="lazy">
            <span class="photo-label">{{ photo }}</span>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
