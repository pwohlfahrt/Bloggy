{% extends "base.html" %}
{% block window %}
<style>
    main.blog-listing {
        width: min(900px, calc(100% - 32px));
        margin: 72px auto 48px;
        float: none;
        box-sizing: border-box;
    }

    .page-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .page-header h1 {
        margin: 0;
        font-size: clamp(2.1rem, 4vw, 3.2rem);
        letter-spacing: -0.04em;
    }

    .article-list {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
    }

    .article-list a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 76px;
        padding: 18px 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0;
        background: rgba(106, 10, 144, 0.68);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.18);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        position: relative;
        overflow: hidden;
    }

    .article-list a::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: rgba(255, 255, 255, 0.08);
        transition: width 0.2s ease;
    }

    .article-list a:hover {
        transform: translate(-4px, -4px);
        box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.2);
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(116, 18, 156, 0.8);
    }

    .article-list a:hover::before {
        width: 100%;
    }

    .article-list h2 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(1.15rem, 2vw, 1.6rem);
        line-height: 1.3;
        letter-spacing: -0.02em;
        font-weight: 600;
    }

    .article-list .read-indicator {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.9;
        border-left: 2px solid rgba(255, 255, 255, 0.45);
        padding-left: 12px;
    }

    @media (max-width: 640px) {
        main.blog-listing {
            margin-top: 56px;
            width: min(100% - 20px, 900px);
        }

        .article-list a {
            padding: 16px 18px;
            min-height: 64px;
        }

        .article-list .read-indicator {
            letter-spacing: 0.08em;
            font-size: 0.72rem;
        }
    }
</style>

<main class="blog-listing">
    <header class="page-header">
        <h1>My articles</h1>
    </header>
    <ul>
        {% for article in all_articles %}
        <li class="article-list">
            <a href="/blog/{{article}}">
                <h2>{{article}}</h2>
                <span class="read-indicator">Read</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</main>
{% endblock %}
